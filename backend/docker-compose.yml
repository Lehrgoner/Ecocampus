services:
  db:
    image: postgis/postgis:16-3.4
    container_name: greenmetric-db
    environment:
      POSTGRES_USER: greenmetric
      POSTGRES_PASSWORD: greenmetric123
      POSTGRES_DB: greenmetric_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: